stack_name = "sam-auto-alarms"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
s3_bucket = "freestone-prod-cloudops-sls-projects"
s3_prefix = "sam/sam-auto-alarms"
confirm_changeset = true
disable_rollback = false
parameter_overrides = [
   "AlarmNotificationARN=arn:aws:sns:us-east-1:954958887876:CloudOps-Notifications-Lower", # Need to change sns topic arn base on the account.
   "LambdaTreatMissingData=notBreaching",
   "EC2TreatMissingData=missing",
   "EC2TreatMissingDataNotificationARN=LambdaFunctionARN" # Need to change Lambda Function arn base on the account.
 ]

